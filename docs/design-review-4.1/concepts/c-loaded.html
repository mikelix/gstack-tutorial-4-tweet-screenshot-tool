<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CONCEPT ONLY — Direction C — Loaded</title>
<style>
  :root{--bg:#1a1a1e;--surface:#232327;--border:#333338;--text:#f4f4f5;--text2:#8b8b93;--accent:#22d3ee;--accent-hov:#0891b2}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Inter",Segoe UI,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
  .badge{position:fixed;top:8px;left:8px;background:#fff;color:#111;font:600 11px/1 monospace;padding:6px 10px;border-radius:4px;z-index:99}
  header{height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px}
  .mark{width:20px;height:20px;border-radius:5px;background:var(--accent)}
  nav.seg{display:flex;background:#141416;border-radius:7px;padding:2px;gap:2px}
  nav.seg a{padding:5px 12px;border-radius:5px;font-size:12px;font-weight:500;color:var(--text2);text-decoration:none}
  nav.seg a.active{background:#2c2c31;color:#fff}
  .urlchip{font-size:11px;color:var(--text2);background:#141416;border:1px solid var(--border);border-radius:6px;padding:5px 10px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gh{font-size:12px;color:var(--text2);text-decoration:none}
  .body{flex:1;display:flex;min-height:0}
  .canvas{flex:1;display:flex;align-items:center;justify-content:center;position:relative;background:
    radial-gradient(circle,#2a2a2f 1px,transparent 1px) 0 0/16px 16px}
  .tweet-bg{width:440px;aspect-ratio:4/3;border-radius:14px;background:linear-gradient(135deg,#22d3ee,#0ea5e9);display:flex;align-items:center;justify-content:center;padding:30px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
  .tweet-card{background:#fff;color:#111;border-radius:13px;padding:19px 21px;max-width:330px;width:100%}
  .tw-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .avatar{width:38px;height:38px;border-radius:50%;background:#d4d4d8}
  .tw-name{font-weight:700;font-size:13px}
  .tw-handle{font-size:12px;color:#71717a}
  .tw-body{font-size:15px;line-height:1.4;margin-bottom:9px}
  .tw-meta{font-size:11px;color:#71717a}
  .floatexport{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 8px 8px 16px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .floatexport span{font-size:12px;color:var(--text2)}
  .floatexport button.primary{padding:9px 16px;border:none;border-radius:8px;background:var(--accent);color:#0b0b0d;font-weight:700;font-size:12px;cursor:pointer}
  .floatexport button.icon{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:14px;cursor:pointer}
  .rail{width:280px;border-left:1px solid var(--border);padding:18px;display:flex;flex-direction:column;gap:22px;overflow-y:auto;flex-shrink:0}
  .field label{display:block;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px}
  .swatches{display:flex;gap:7px;flex-wrap:wrap}
  .swatch{width:26px;height:26px;border-radius:7px;border:2px solid transparent;cursor:pointer}
  .swatch.sel{border-color:var(--accent)}
  input[type=range]{width:100%}
  .btnrow{display:flex;gap:5px}
  .btnrow button{flex:1;padding:7px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text);font-size:11px;font-weight:500;cursor:pointer}
  .btnrow button.sel{border-color:var(--accent);color:var(--accent);background:rgba(34,211,238,.1)}
  @media (max-width:480px){
    header{padding:0 12px;flex-wrap:wrap;height:auto;gap:6px;padding-top:8px;padding-bottom:8px}
    .urlchip{max-width:140px}
    .body{flex-direction:column}
    .canvas{min-height:320px;padding-bottom:70px}
    .tweet-bg{width:88%}
    .floatexport{bottom:14px;padding:6px 6px 6px 12px}
    .rail{width:100%;border-left:none;border-top:1px solid var(--border);flex-direction:row;flex-wrap:wrap;gap:16px}
    .rail .field{flex:1 1 140px}
  }
</style>
</head>
<body>
<div class="badge">CONCEPT ONLY — NOT IMPLEMENTED — Direction C</div>
<header>
  <div class="brand"><span class="mark"></span>Tweet Screenshot</div>
  <nav class="seg"><a class="active" href="#">Single Tweet</a><a href="#">Thread</a></nav>
  <div class="urlchip">x.com/jack/status/20</div>
  <a class="gh" href="#">GitHub</a>
</header>
<div class="body">
  <div class="canvas">
    <div class="tweet-bg">
      <div class="tweet-card">
        <div class="tw-head"><div class="avatar"></div><div><div class="tw-name">jack</div><div class="tw-handle">@jack</div></div></div>
        <div class="tw-body">just setting up my twttr</div>
        <div class="tw-meta">4:50 AM · Mar 22, 2006</div>
      </div>
    </div>
    <div class="floatexport">
      <span>Export</span>
      <button class="primary">Download PNG</button>
      <button class="icon">⧉</button>
      <button class="icon">🔗</button>
    </div>
  </div>
  <div class="rail">
    <div class="field"><label>Background</label>
      <div class="swatches">
        <div class="swatch sel" style="background:linear-gradient(135deg,#22d3ee,#0ea5e9)"></div>
        <div class="swatch" style="background:linear-gradient(135deg,#f97316,#ef4444)"></div>
        <div class="swatch" style="background:#0f172a"></div>
        <div class="swatch" style="background:#22c55e"></div>
        <div class="swatch" style="background:#fff"></div>
        <div class="swatch" style="background:#000"></div>
      </div>
    </div>
    <div class="field"><label>Padding — 48px</label><input type="range" /></div>
    <div class="field"><label>Export scale</label>
      <div class="btnrow"><button>1x</button><button class="sel">2x</button><button>3x</button></div>
    </div>
    <div class="field"><label>Theme</label>
      <div class="btnrow"><button class="sel">Light</button><button>Dark</button></div>
    </div>
  </div>
</div>
</body>
</html>
