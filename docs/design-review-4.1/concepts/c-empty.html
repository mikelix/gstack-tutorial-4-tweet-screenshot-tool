<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CONCEPT ONLY — Direction C — Empty</title>
<style>
  :root{--bg:#1a1a1e;--surface:#232327;--border:#333338;--text:#f4f4f5;--text2:#8b8b93;--accent:#22d3ee;--accent-hov:#0891b2}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Inter",Segoe UI,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
  .badge{position:fixed;top:8px;left:8px;background:#fff;color:#111;font:600 11px/1 monospace;padding:6px 10px;border-radius:4px;z-index:99}
  header{height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px}
  .mark{width:20px;height:20px;border-radius:5px;background:var(--accent)}
  nav.seg{display:flex;background:#141416;border-radius:7px;padding:2px;gap:2px}
  nav.seg a{padding:5px 12px;border-radius:5px;font-size:12px;font-weight:500;color:var(--text2);text-decoration:none}
  nav.seg a.active{background:#2c2c31;color:#fff}
  .gh{font-size:12px;color:var(--text2);text-decoration:none}
  .canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center}
  .empty-inner{text-align:center;max-width:440px}
  .icon{width:56px;height:56px;border-radius:14px;background:var(--surface);border:1px solid var(--border);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--accent)}
  h1{font-size:22px;margin:0 0 8px;font-weight:600}
  p.lead{font-size:13px;color:var(--text2);margin:0 0 24px;line-height:1.5}
  .inputrow{display:flex;gap:8px}
  input{flex:1;padding:11px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);color:var(--text)}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  button.primary{padding:11px 18px;border:none;border-radius:8px;background:var(--accent);color:#0b0b0d;font-weight:700;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="badge">CONCEPT ONLY — NOT IMPLEMENTED — Direction C</div>
<header>
  <div class="brand"><span class="mark"></span>Tweet Screenshot</div>
  <nav class="seg"><a class="active" href="#">Single Tweet</a><a href="#">Thread</a></nav>
  <a class="gh" href="#">GitHub</a>
</header>
<div class="canvas-wrap">
  <div class="empty-inner">
    <div class="icon">＋</div>
    <h1>Start a new canvas</h1>
    <p class="lead">Paste an X/Twitter link to load it onto the canvas and start customizing.</p>
    <div class="inputrow">
      <input placeholder="https://x.com/user/status/…" />
      <button class="primary">Load</button>
    </div>
  </div>
</div>
</body>
</html>
