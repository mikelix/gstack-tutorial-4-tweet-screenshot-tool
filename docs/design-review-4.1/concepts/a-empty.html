<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CONCEPT ONLY — Direction A — Empty</title>
<style>
  :root{
    --bg:#fafafa; --surface:#ffffff; --border:#e5e5e3; --text:#18181b;
    --text2:#71717a; --accent:#1d4ed8; --accent-hov:#1e40af;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Inter",Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
  .badge{position:fixed;top:8px;left:8px;background:#111;color:#fff;font:600 11px/1 monospace;padding:6px 10px;border-radius:4px;z-index:99;letter-spacing:.02em}
  header{border-bottom:1px solid var(--border);background:var(--surface)}
  .shell{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 24px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
  .mark{width:22px;height:22px;border-radius:6px;background:var(--accent)}
  nav.seg{display:flex;background:#f4f4f5;border-radius:8px;padding:3px;gap:2px}
  nav.seg a{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;color:var(--text2);text-decoration:none}
  nav.seg a.active{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .gh{font-size:13px;color:var(--text2);text-decoration:none}
  main{max-width:720px;margin:0 auto;padding:96px 24px 40px;text-align:center}
  h1{font-size:38px;line-height:1.15;letter-spacing:-.02em;margin:0 0 14px;font-weight:650}
  p.lead{font-size:16px;color:var(--text2);margin:0 0 40px;line-height:1.5}
  .inputrow{display:flex;gap:8px;max-width:560px;margin:0 auto}
  input{flex:1;padding:13px 16px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--surface)}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  button.primary{padding:13px 22px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;cursor:pointer}
  button.primary:hover{background:var(--accent-hov)}
  .try{margin-top:14px;font-size:13px}
  .try a{color:var(--accent);text-decoration:none;font-weight:500}
  .hint{margin-top:64px;font-size:12px;color:#a1a1aa}
</style>
</head>
<body>
<div class="badge">CONCEPT ONLY — NOT IMPLEMENTED — Direction A</div>
<header>
  <div class="shell">
    <div class="brand"><span class="mark"></span>Tweet Screenshot</div>
    <nav class="seg"><a class="active" href="#">Single Tweet</a><a href="#">Thread</a></nav>
    <a class="gh" href="#">GitHub</a>
  </div>
</header>
<main>
  <h1>Turn any tweet into a beautiful image.</h1>
  <p class="lead">Paste an X link, customize the look, and export a high-resolution PNG.</p>
  <div class="inputrow">
    <input placeholder="https://x.com/user/status/…" />
    <button class="primary">Create</button>
  </div>
  <div class="try"><a href="#">Try an example instead →</a></div>
  <div class="hint">No account needed · exports run entirely in your browser</div>
</main>
</body>
</html>
